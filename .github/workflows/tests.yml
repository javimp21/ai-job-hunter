name: Offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      TYPESAFE_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev,browser,jev]"
      - name: Run offline test suite
        run: python -m pytest
