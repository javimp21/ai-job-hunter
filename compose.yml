services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ai_job_hunter
      POSTGRES_USER: ai_job_hunter
      POSTGRES_PASSWORD: ai_job_hunter
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_job_hunter -d ai_job_hunter"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
