[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-job-hunter"
version = "0.1.0"
description = "A personal, deliberate job discovery and application tracking system."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.13,<2",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "SQLAlchemy>=2.0,<3",
]

[project.scripts]
ai-job-hunter = "ai_job_hunter.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "typesafe-sdk==0.7.1",
]
jev = [
    "typesafe-sdk==0.7.1",
]
llm = [
    "anthropic>=1,<2",
]
browser = [
    "playwright>=1.48,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
